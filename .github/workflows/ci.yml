name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, migrate, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sankofa
          POSTGRES_PASSWORD: sankofa
          POSTGRES_DB: sankofa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sankofa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sankofa:sankofa@localhost:5432/sankofa_test
      DIRECT_URL: postgresql://sankofa:sankofa@localhost:5432/sankofa_test
      APP_SECRET: ci-only-secret-that-is-long-enough-0123456789
      PUBLIC_SITE_URL: http://localhost:4200
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Check the migrated database matches the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm test

  site:
    name: Site — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:vercel
